# PUBLIC, passwordless mobile scanner on a DEDICATED HTTPS vhost.
# The existing production :80 vhost and its API are NOT changed.
# Scanner observations and anonymous scan controls become internet-visible.
# Only GET/POST /api/manual-scanner/* are allowed; the main API is 404.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 149-56-45-39.sslip.io;

    ssl_certificate /etc/letsencrypt/live/markethunter-scanner-mobile/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markethunter-scanner-mobile/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 16k;

    location = / {
        return 302 /scanner;
    }

    # Public manual scans are restricted globally (all visitors combined)
    # to one POST /runs per minute, with no burst. GET /runs remains
    # unrestricted by this POST-only limiter so initial page load works.
    location = /api/manual-scanner/runs {
        limit_except GET POST { deny all; }
        limit_req zone=mh_scanner_public_start;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010/manual-scanner/runs;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # Do not publish the runtime diagnostics or any other API routes.
    location ^~ /api/manual-scanner/diagnostics/ { return 404; }
    location ^~ /api/manual-scanner/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8010/manual-scanner/;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/ { return 404; }
    location / {
        root /var/www/markethunter-scanner-mobile;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
