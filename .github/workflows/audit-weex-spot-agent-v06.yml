name: Audit WEEX Spot Agent v06

on:
  push:
    branches:
      - deploy/weex-spot-agent-v06-vps
    paths:
      - .github/workflows/audit-weex-spot-agent-v06.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      VPS_HOST: 149.56.45.39
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Verify service and recent scan activity
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/key "ubuntu@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n systemctl is-enabled --quiet weex-spot-agent-v06.service
          sudo -n systemctl is-active --quiet weex-spot-agent-v06.service
          test -s /home/ubuntu/weex_spot_agent_v06/agent.log
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path("/home/ubuntu/weex_spot_agent_v06/agent.log")
          events=[]
          for line in p.read_text(encoding="utf-8",errors="replace").splitlines()[-500:]:
              try:
                  d=json.loads(line)
              except Exception:
                  continue
              events.append(d)
          counts=Counter(str(e.get("type","UNKNOWN")) for e in events)
          cycle_starts=[e for e in events if e.get("type")=="CYCLE_START"]
          cycle_ends=[e for e in events if e.get("type")=="CYCLE_END"]
          telegram_errors=[e for e in events if e.get("type")=="TELEGRAM_ERROR"]
          aborted=[e for e in events if e.get("type")=="CYCLE_ABORTED"]
          print("SERVICE_ENABLED=YES")
          print("SERVICE_ACTIVE=YES")
          print("RECENT_EVENTS="+str(len(events)))
          print("CYCLE_START_COUNT="+str(len(cycle_starts)))
          print("CYCLE_END_COUNT="+str(len(cycle_ends)))
          print("CYCLE_ABORTED_COUNT="+str(len(aborted)))
          print("TELEGRAM_ERROR_COUNT="+str(len(telegram_errors)))
          if cycle_starts:
              print("LAST_CYCLE_START="+str(cycle_starts[-1].get("time_utc","unknown")))
          if cycle_ends:
              print("LAST_CYCLE_END_ELAPSED_SECONDS="+str(cycle_ends[-1].get("elapsed_seconds","unknown")))
          if not cycle_starts:
              raise SystemExit("NO_SCAN_CYCLE_START_FOUND")
          PY
          REMOTE
