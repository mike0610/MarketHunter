name: Spot Historical Evidence Live Gate

on:
  push:
    branches:
      - chatgpt/spot-historical-evidence-access
    paths:
      - .github/workflows/spot-historical-evidence-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vps-live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout accessor branch
        uses: actions/checkout@v4

      - name: Fail closed when VPS SSH secret is unavailable
        env:
          VPS_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_KEY" || { echo 'TERMINAL_STATE=BLOCKED-TOOLING'; exit 1; }

      - name: Configure bounded SSH access
        env:
          VPS_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/markethunter_vps
          chmod 600 ~/.ssh/markethunter_vps
          ssh-keyscan -H 149.56.45.39 >> ~/.ssh/known_hosts

      - name: Stage accessor in temporary VPS directory
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_DIR="/tmp/mh-sl-val-mom-003-${GITHUB_RUN_ID}"
          echo "REMOTE_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/markethunter_vps ubuntu@149.56.45.39 \
            "rm -rf '$REMOTE_DIR' && mkdir -p '$REMOTE_DIR/scripts' '$REMOTE_DIR/exchange' '$REMOTE_DIR/evidence'"
          scp -i ~/.ssh/markethunter_vps scripts/spot_historical_evidence.py \
            ubuntu@149.56.45.39:"$REMOTE_DIR/scripts/spot_historical_evidence.py"
          scp -i ~/.ssh/markethunter_vps exchange/endpoints.py \
            ubuntu@149.56.45.39:"$REMOTE_DIR/exchange/endpoints.py"

      - name: Execute frozen BTCUSDT Spot acquisition on VPS
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh -i ~/.ssh/markethunter_vps ubuntu@149.56.45.39 \
            "cd '$REMOTE_DIR' && /home/ubuntu/MarketHunter/.venv/bin/python scripts/spot_historical_evidence.py --interval 1h --start 2026-08-22T00:00:00Z --end 2026-08-24T00:00:00Z --output-dir evidence 2>&1 | tee acquisition.log"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'TERMINAL_STATE=BLOCKED-PROVIDER-ACCESS'
          fi
          ssh -i ~/.ssh/markethunter_vps ubuntu@149.56.45.39 \
            "cd '$REMOTE_DIR' && tar -czf evidence.tar.gz evidence acquisition.log"
          scp -i ~/.ssh/markethunter_vps \
            ubuntu@149.56.45.39:"$REMOTE_DIR/evidence.tar.gz" ./evidence.tar.gz
          tar -xzf evidence.tar.gz
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Verify immutable evidence locally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          run_dirs = [p for p in Path('evidence').iterdir() if p.is_dir()]
          assert len(run_dirs) == 1, run_dirs
          run_dir = run_dirs[0]
          manifest = json.loads((run_dir / 'manifest.json').read_text())
          dataset = (run_dir / 'dataset.json').read_bytes()
          actual = hashlib.sha256(dataset).hexdigest()
          assert actual == manifest['dataset_sha256'], (actual, manifest['dataset_sha256'])
          assert manifest['row_count'] == 48, manifest['row_count']
          assert all(manifest['integrity'].values()), manifest['integrity']
          print('TERMINAL_STATE=LIVE-EVIDENCE-READY')
          print(f"RUN_DIR={run_dir}")
          print(f"ROW_COUNT={manifest['row_count']}")
          print(f"DATASET_SHA256={actual}")
          print(f"BASE_URL={manifest['base_url']}")
          PY

      - name: Upload immutable evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl-val-mom-003-live-evidence-vps
          path: |
            evidence/**
            acquisition.log
            evidence.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary VPS execution directory
        if: always()
        shell: bash
        run: |
          if [ -n "${REMOTE_DIR:-}" ]; then
            ssh -i ~/.ssh/markethunter_vps ubuntu@149.56.45.39 "rm -rf '$REMOTE_DIR'" || true
          fi
