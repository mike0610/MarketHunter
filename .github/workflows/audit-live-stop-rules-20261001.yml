name: Audit Live Stop Rules 2026-10-01

on:
  push:
    branches:
      - audit/research-strategy-stats-20261001
    paths:
      - .github/workflows/audit-live-stop-rules-20261001.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VPS_HOST: 149.56.45.39
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Read exact live monitor stop rules
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/key "ubuntu@${VPS_HOST}" 'python3 -' <<'PY'
          from pathlib import Path
          p=Path("/home/ubuntu/MarketHunter/app/monitor_worker.py")
          lines=p.read_text(encoding="utf-8",errors="replace").splitlines()
          hits=[i for i,x in enumerate(lines) if any(k in x.lower() for k in (
              "live_stop_loss","live_take_profit","breakeven","profit_lock","stop_loss","take_profit"
          ))]
          selected=set()
          for i in hits:
              selected.update(range(max(0,i-14),min(len(lines),i+32)))
          print("LIVE_RULES_BEGIN")
          for i in sorted(selected):
              print(f"{i+1}: {lines[i]}")
          print("LIVE_RULES_END")
          PY
