name: Mobile Scanner VPS Preflight (read only)

on:
  push:
    branches:
      - feature/mobile-scanner-paper-vps-prep-20260925
    paths:
      - .github/workflows/mobile-scanner-vps-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: 149.56.45.39
      VPS_USER: ubuntu
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify read-only SSH access is configured
        run: |
          test -n "${SSH_PRIVATE_KEY}" || { echo "BLOCKED: VPS SSH secret is unavailable"; exit 2; }
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts
      - name: Inspect existing ingress and runtime without mutations
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/key "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/MarketHunter
          echo "VPS_SHA=$(git rev-parse --short HEAD)"
          echo "PYTHON_ENV=$([ -x .venv/bin/python ] && echo READY || echo MISSING)"
          echo "DASHBOARD_FILES=$([ -f dashboard/dist/index.html ] && echo PRESENT || echo UNKNOWN)"
          echo "SCANNER_SERVICE=$(systemctl is-active standalone-manual-scanner.service 2>/dev/null || true)"
          echo "EXPERIMENT_TIMER=$(systemctl is-active experiment1-runtime.timer 2>/dev/null || true)"
          echo "RESEARCH_SIGNALS_DB=$([ -f data/research_strategy_signals.db ] && echo PRESENT || echo MISSING)"
          echo "PAPER_DB=$([ -f data/experimental_paper.db ] && echo PRESENT || echo MISSING)"
          echo "LOCAL_SCANNER_HTTP=$(curl --max-time 3 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8010/manual-scanner/runs || true)"
          # Never print Nginx configuration, environment values, URLs, credentials or API keys.
          # Presence of an auth directive anywhere does NOT establish that the intended
          # /api/manual-scanner location is access-controlled; operator validation required.
          CONFIG="$(sudo -n nginx -T 2>/dev/null || true)"
          if [ -z "$CONFIG" ]; then
            echo "NGINX_CONFIG=UNAVAILABLE"
          else
            export CONFIG
            python3 - <<'PY'
          import os
          c=os.environ.pop("CONFIG", "")
          for label, term in [
              ("API_LOCATION_PRESENT", "location /api"),
              ("SCANNER_LOCATION_PRESENT", "/api/manual-scanner"),
              ("AUTH_DIRECTIVE_PRESENT_NOT_PROOF", "auth_basic"),
              ("AUTH_REQUEST_PRESENT_NOT_PROOF", "auth_request"),
          ]:
              print(f"{label}={'YES' if term in c else 'NO'}")
          print("INGRESS_AUTH_PROOF=NOT_VERIFIED")
          PY
          fi
          echo "PREFLIGHT_COMPLETE=READ_ONLY"
          REMOTE
