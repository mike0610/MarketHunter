# Isolated HTTPS vhost for the manual scanner. This file does NOT change
# the existing port-80 MarketHunter server block.
# Requires a verified Let's Encrypt certificate and local root-owned htpasswd.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 149-56-45-39.sslip.io;

    ssl_certificate /etc/letsencrypt/live/markethunter-scanner-mobile/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markethunter-scanner-mobile/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    auth_basic "MarketHunter private Scanner";
    auth_basic_user_file /etc/nginx/.markethunter-scanner-auth;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 16k;

    # Basic credentials are checked by Nginx and NEVER passed to FastAPI.
    location ^~ /api/manual-scanner/ {
        proxy_pass http://127.0.0.1:8010/manual-scanner/;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # No new ingress to production API or other internal services.
    location ^~ /api/ {
        return 404;
    }

    location / {
        root /var/www/markethunter-scanner-mobile;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
