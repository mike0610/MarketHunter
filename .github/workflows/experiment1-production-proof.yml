name: Experiment1 Production Proof

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      decision_id:
        description: "Optional exact GIL decision_id to audit"
        required: false
        type: string
      slack_ts:
        description: "Optional exact Slack message ts for journal evidence"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: experiment1-production-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: 149.56.45.39
      VPS_USER: ubuntu
      VPS_REPO: /home/ubuntu/MarketHunter
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
      DECISION_ID: ${{ inputs.decision_id || '' }}
      SLACK_TS: ${{ inputs.slack_ts || '' }}

    steps:
      - name: Validate proof inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'MISSING SSH SECRET'; exit 2; }
          if [ -n "$DECISION_ID" ]; then
            [[ "$DECISION_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]] || { echo 'INVALID decision_id'; exit 3; }
          fi
          if [ -n "$SLACK_TS" ]; then
            [[ "$SLACK_TS" =~ ^[0-9]{10}\.[0-9]{6}$ ]] || { echo 'INVALID slack_ts'; exit 4; }
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/markethunter_vps_ed25519
          chmod 600 ~/.ssh/markethunter_vps_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Autonomous read-only production proof
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/markethunter_vps_ed25519"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$KEY" \
            "$VPS_USER@$VPS_HOST" "DECISION_ID='$DECISION_ID' SLACK_TS='$SLACK_TS' bash -s" <<'REMOTE'
          set -euo pipefail
          REPO=/home/ubuntu/MarketHunter
          cd "$REPO"

          echo '=== PRODUCTION SHA ==='
          git rev-parse HEAD

          echo '=== RUNTIME HEALTH ==='
          systemctl is-active experiment1-runtime.timer
          systemctl is-active markethunter-api
          systemctl is-active markethunter-worker

          echo '=== RECENT TRANSPORT HEALTH ==='
          journalctl -u experiment1-runtime.service --since '-20 minutes' --no-pager \
            | grep -E 'GIL Slack transport:|Slack GIL envelope rejected|experiment1 runtime cycle (starting|complete|failed)' \
            | tail -n 80 || true

          if [ -n "$SLACK_TS" ]; then
            echo '=== TARGET SLACK EVIDENCE ==='
            journalctl -u experiment1-runtime.service --since '-24 hours' --no-pager | grep -F "$SLACK_TS" || true
          fi

          echo '=== DECISION PIPELINE PROOF ==='
          DECISION_ID="$DECISION_ID" "$REPO/.venv/bin/python" - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          requested = os.environ.get('DECISION_ID', '').strip()
          db = Path(os.environ.get('EXPERIMENT1_DB_PATH', 'data/experiment1.db'))
          print('db=', db, 'exists=', db.exists())
          if not db.exists():
              raise SystemExit(5)

          con = sqlite3.connect(f'file:{db}?mode=ro', uri=True)
          con.row_factory = sqlite3.Row
          tables = {r[0] for r in con.execute("select name from sqlite_master where type='table'")}
          inbox = 'experiment1_gil_decision_inbox'
          if inbox not in tables:
              print('PROOF=BLOCKED missing inbox table')
              raise SystemExit(6)

          inbox_cols = [r[1] for r in con.execute(f'pragma table_info({inbox})')]
          order_col = 'received_at' if 'received_at' in inbox_cols else 'decision_id'
          if requested:
              decision_ids = [requested]
          else:
              decision_ids = [
                  r[0] for r in con.execute(
                      f'SELECT decision_id FROM {inbox} ORDER BY {order_col} DESC LIMIT 20'
                  )
              ]

          if not decision_ids:
              print('PROOF=IDLE no GIL decisions in inbox')
              con.close()
              raise SystemExit(0)

          def count_by_key(table, keys, value):
              if table not in tables:
                  return None
              cols = [r[1] for r in con.execute(f'pragma table_info({table})')]
              key = next((k for k in keys if k in cols), None)
              if key is None:
                  return None
              return con.execute(f'SELECT COUNT(*) FROM {table} WHERE {key}=?', (value,)).fetchone()[0]

          for decision_id in decision_ids:
              intent_id = f'gil-decision:{decision_id}'
              inbox_count = con.execute(
                  f'SELECT COUNT(*) FROM {inbox} WHERE decision_id=?', (decision_id,)
              ).fetchone()[0]
              intent_count = count_by_key('experiment1_intents', ('intent_id',), intent_id)
              fill_count = count_by_key('experiment1_fills', ('intent_id', 'source_intent_id'), intent_id)
              position_count = count_by_key('experiment1_positions', ('intent_id', 'source_intent_id'), intent_id)
              print(
                  f'decision_id={decision_id} inbox={inbox_count} '
                  f'intent={intent_count} fill={fill_count} position={position_count}'
              )
          con.close()
          PY
          REMOTE
