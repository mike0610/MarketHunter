# Loaded within Nginx http {} from /etc/nginx/conf.d/.
# Blank key on GET => no limit; POST /runs => all IPs share same quota.
map $request_method $mh_scanner_public_start_key {
    default "";
    POST $server_name;
}
limit_req_zone $mh_scanner_public_start_key zone=mh_scanner_public_start:1m rate=1r/m;
