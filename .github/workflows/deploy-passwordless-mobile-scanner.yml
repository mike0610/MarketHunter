name: Mobile Scanner Passwordless HTTPS (isolated vhost only)

on:
  push:
    branches:
      - feature/mobile-scanner-paper-vps-prep-20260925
    paths:
      - .github/workflows/deploy-passwordless-mobile-scanner.yml

permissions:
  contents: read

jobs:
  passwordless:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      VPS_HOST: 149.56.45.39
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated changes only
        run: |
          set -euo pipefail
          test -s deploy/nginx/markethunter-scanner-public.conf
          test -s deploy/nginx/markethunter-scanner-public-rate.conf
          grep -q 'location ^~ /api/ { return 404; }' deploy/nginx/markethunter-scanner-public.conf
          grep -q 'ssl_certificate ' deploy/nginx/markethunter-scanner-public.conf
          grep -q 'zone=mh_scanner_public_start' deploy/nginx/markethunter-scanner-public.conf
          test -n "${SSH_PRIVATE_KEY}" || { echo 'BLOCKED: VPS SSH secret missing'; exit 2; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts
      - name: Transfer only the new dedicated Nginx configs
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -i ~/.ssh/key deploy/nginx/markethunter-scanner-public.conf "ubuntu@${VPS_HOST}:/tmp/markethunter-scanner-public-${GITHUB_SHA}.conf"
          scp -o BatchMode=yes -i ~/.ssh/key deploy/nginx/markethunter-scanner-public-rate.conf "ubuntu@${VPS_HOST}:/tmp/markethunter-scanner-public-rate-${GITHUB_SHA}.conf"
      - name: Apply isolated Nginx vhost, verify and roll back on failure
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/key "ubuntu@${VPS_HOST}" "GITHUB_SHA=${GITHUB_SHA} bash -s" <<'REMOTE'
          set -euo pipefail
          SITE=/etc/nginx/sites-available/markethunter-scanner-mobile.conf
          RATE=/etc/nginx/conf.d/markethunter-scanner-public-rate.conf
          test -f "$SITE"
          test -L /etc/nginx/sites-enabled/markethunter-scanner-mobile.conf
          test ! -e "$RATE"
          sudo -n test -s /etc/letsencrypt/live/markethunter-scanner-mobile/fullchain.pem
          curl -fsS --max-time 4 http://127.0.0.1:8010/manual-scanner/runs >/dev/null
          TMP_BACKUP="$(mktemp)"
          sudo -n cp "$SITE" "$TMP_BACKUP"
          rollback() {
            echo "PASSWORDLESS_INGRESS=ROLLING_BACK"
            sudo -n cp "$TMP_BACKUP" "$SITE"
            sudo -n rm -f "$RATE"
            sudo -n nginx -t && sudo -n systemctl reload nginx || true
          }
          trap rollback ERR
          sudo -n install -m 644 "/tmp/markethunter-scanner-public-rate-${GITHUB_SHA}.conf" "$RATE"
          sudo -n install -m 644 "/tmp/markethunter-scanner-public-${GITHUB_SHA}.conf" "$SITE"
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          BASE=https://149-56-45-39.sslip.io
          RESOLVE=149-56-45-39.sslip.io:443:127.0.0.1
          wait_status() {
            path="$1"
            expected="$2"
            status=""
            for _ in $(seq 1 20); do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve "$RESOLVE" "$BASE$path" || true)"
              [ "$status" = "$expected" ] && return 0
              sleep 0.5
            done
            echo "LOCAL_STATUS_MISMATCH path=$path expected=$expected actual=$status"
            return 1
          }
          wait_status /scanner 200
          wait_status /api/manual-scanner/runs 200
          for path in /api/experiment1/state /api/manual-scanner/diagnostics/weex-spot-history; do
            STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve "$RESOLVE" "$BASE$path")"
            test "$STATUS" = 404
          done
          # Invalid JSON: exercise anonymous POST safety without starting a scan.
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve "$RESOLVE" -H 'Content-Type: application/json' -d '{invalid' "$BASE/api/manual-scanner/runs")"
          test "$STATUS" = 422
          # Every client shares one request/start per minute, no burst.
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve "$RESOLVE" -H 'Content-Type: application/json' -d '{invalid' "$BASE/api/manual-scanner/runs")"
          test "$STATUS" = 429
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 --resolve "$RESOLVE" "$BASE/api/manual-scanner/runs")"
          test "$STATUS" = 200
          rm -f "$TMP_BACKUP" "/tmp/markethunter-scanner-public-${GITHUB_SHA}.conf" "/tmp/markethunter-scanner-public-rate-${GITHUB_SHA}.conf"
          trap - ERR
          echo "LOCAL_PASSWORDLESS_SCANNER=PASS"
          echo "ANONYMOUS_POST_RATE_LIMIT=PASS"
          echo "PRODUCTION_API_HIDDEN=PASS"
          echo "MAIN_NGINX_PORT80=UNCHANGED"
          REMOTE
      - name: Verify public HTTPS without credentials, main API isolated
        run: |
          set -euo pipefail
          BASE=https://149-56-45-39.sslip.io
          RESOLVE=149-56-45-39.sslip.io:443:${VPS_HOST}
          for path in /scanner /api/manual-scanner/runs; do
            STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 12 --resolve "$RESOLVE" "$BASE$path")"
            test "$STATUS" = 200 || { echo "EXTERNAL_ANONYMOUS=FAILED status=$STATUS"; exit 4; }
          done
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 12 --resolve "$RESOLVE" "$BASE/api/experiment1/state")"
          test "$STATUS" = 404 || { echo "PRODUCTION_API_ISOLATION=FAILED status=$STATUS"; exit 4; }
          echo "EXTERNAL_PASSWORDLESS_HTTPS=PASS"
          echo "EXTERNAL_MAIN_API_HIDDEN=PASS"
