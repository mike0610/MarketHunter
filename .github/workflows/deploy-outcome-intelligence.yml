name: Deploy Outcome Intelligence

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-outcome-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: outcome-intelligence-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: 149.56.45.39
      VPS_USER: ubuntu
      VPS_REPO: /home/ubuntu/MarketHunter
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
      SLACK_WEBHOOK: ${{ secrets.OUTCOME_INTELLIGENCE_SLACK_WEBHOOK_URL }}

    steps:
      - name: Fail closed when SSH secret is unavailable
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "MISSING SSH SECRET: MARKETHUNTER_VPS_SSH_PRIVATE_KEY"
            exit 2
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/markethunter_vps_ed25519
          chmod 600 ~/.ssh/markethunter_vps_ed25519
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy weekly runtime and create first snapshot
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/markethunter_vps_ed25519"

          # Send the optional Slack webhook only over SSH stdin. GitHub masks
          # repository-secret values in logs; the remote script never echoes it.
          printf '%s' "${SLACK_WEBHOOK}" | ssh -i "$KEY" "${VPS_USER}@${VPS_HOST}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          REPO=/home/ubuntu/MarketHunter
          ENV_FILE="$REPO/deploy/systemd/outcome-intelligence.env"

          cd "$REPO"
          git fetch origin master
          git checkout master
          git pull --ff-only origin master

          # Preserve an existing approved runtime env file. If it is absent,
          # create one only when the GitHub Slack secret is supplied.
          if [ ! -f "$ENV_FILE" ]; then
            IFS= read -r SLACK_WEBHOOK || true
            if [ -z "${SLACK_WEBHOOK:-}" ]; then
              echo "NEEDS-RUNTIME-SECRET: OUTCOME_INTELLIGENCE_SLACK_WEBHOOK_URL"
              exit 3
            fi
            umask 077
            {
              printf '%s\n' 'OUTCOME_INTELLIGENCE_API_BASE_URL=http://127.0.0.1:8000'
              printf 'OUTCOME_INTELLIGENCE_SLACK_WEBHOOK_URL=%s\n' "$SLACK_WEBHOOK"
              printf '%s\n' 'OUTCOME_INTELLIGENCE_OUTPUT_DIR=data/outcome_intelligence'
            } > "$ENV_FILE"
            chown ubuntu:ubuntu "$ENV_FILE"
            chmod 600 "$ENV_FILE"
          fi

          # Install only the service needed for one-shot capture plus the
          # weekly autonomous service/timer. Daily timer is explicitly disabled.
          sudo cp deploy/systemd/outcome-intelligence-daily.service \
                  deploy/systemd/outcome-intelligence-weekly.service \
                  deploy/systemd/outcome-intelligence-weekly.timer \
                  /etc/systemd/system/
          sudo systemctl disable --now outcome-intelligence-daily.timer >/dev/null 2>&1 || true
          sudo rm -f /etc/systemd/system/outcome-intelligence-daily.timer
          sudo systemctl daemon-reload
          sudo systemctl enable --now outcome-intelligence-weekly.timer

          # First real production capture now. This must use the canonical API path
          # from the merged runtime code and does not mutate research outcomes.
          sudo systemctl start outcome-intelligence-daily.service

          echo '=== DEPLOYED MASTER ==='
          git rev-parse HEAD
          echo '=== WEEKLY TIMER ==='
          systemctl is-enabled outcome-intelligence-weekly.timer
          systemctl is-active outcome-intelligence-weekly.timer
          systemctl list-timers 'outcome-intelligence-weekly.timer' --no-pager
          echo '=== DAILY TIMER MUST BE DISABLED ==='
          systemctl is-enabled outcome-intelligence-daily.timer 2>/dev/null || true
          echo '=== FIRST CAPTURE SERVICE ==='
          systemctl status outcome-intelligence-daily.service --no-pager || true
          journalctl -u outcome-intelligence-daily.service -n 80 --no-pager
          echo '=== ARTIFACTS ==='
          find "$REPO/data/outcome_intelligence" -maxdepth 3 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %p\n' 2>/dev/null | sort | tail -n 20
          echo '=== EXISTING SERVICES UNAFFECTED ==='
          systemctl is-active markethunter-api markethunter-worker markethunter-monitor nginx
          REMOTE
