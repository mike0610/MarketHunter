name: Experiment1 Production Proof

on:
  workflow_dispatch:
    inputs:
      decision_id:
        description: "Exact GIL decision_id to audit"
        required: true
        type: string
      slack_ts:
        description: "Optional exact Slack message ts for journal evidence"
        required: false
        type: string

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: 149.56.45.39
      VPS_USER: ubuntu
      VPS_REPO: /home/ubuntu/MarketHunter
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
      DECISION_ID: ${{ inputs.decision_id }}
      SLACK_TS: ${{ inputs.slack_ts }}

    steps:
      - name: Validate proof inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'MISSING SSH SECRET'; exit 2; }
          [[ "$DECISION_ID" =~ ^[A-Za-z0-9._:-]{1,160}$ ]] || { echo 'INVALID decision_id'; exit 3; }
          if [ -n "$SLACK_TS" ]; then
            [[ "$SLACK_TS" =~ ^[0-9]{10}\.[0-9]{6}$ ]] || { echo 'INVALID slack_ts'; exit 4; }
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/markethunter_vps_ed25519
          chmod 600 ~/.ssh/markethunter_vps_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only production proof
        shell: bash
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/markethunter_vps_ed25519"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$KEY" \
            "$VPS_USER@$VPS_HOST" "DECISION_ID='$DECISION_ID' SLACK_TS='$SLACK_TS' bash -s" <<'REMOTE'
          set -euo pipefail
          REPO=/home/ubuntu/MarketHunter
          cd "$REPO"

          echo '=== PRODUCTION SHA ==='
          git rev-parse HEAD

          echo '=== TARGETED TRANSPORT EVIDENCE ==='
          if [ -n "$SLACK_TS" ]; then
            journalctl -u experiment1-runtime.service --since '-30 minutes' --no-pager | grep -F "$SLACK_TS" || true
          fi
          journalctl -u experiment1-runtime.service --since '-30 minutes' --no-pager | grep -F "$DECISION_ID" || true

          echo '=== READ-ONLY DECISION PIPELINE AUDIT ==='
          DECISION_ID="$DECISION_ID" "$REPO/.venv/bin/python" - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          decision_id = os.environ['DECISION_ID']
          db = Path(os.environ.get('EXPERIMENT1_DB_PATH', 'data/experiment1.db'))
          print('db=', db, 'exists=', db.exists())
          if not db.exists():
              raise SystemExit(5)

          con = sqlite3.connect(f'file:{db}?mode=ro', uri=True)
          con.row_factory = sqlite3.Row
          names = {r[0] for r in con.execute("select name from sqlite_master where type='table'")}
          targets = [
              'experiment1_gil_decision_inbox',
              'experiment1_intents',
              'experiment1_fills',
              'experiment1_positions',
          ]
          for table in targets:
              if table not in names:
                  print(f'{table}=MISSING_TABLE')
                  continue
              columns = [r[1] for r in con.execute(f'pragma table_info({table})')]
              key = next((c for c in ('decision_id', 'source_decision_id', 'gil_decision_id') if c in columns), None)
              if key:
                  count = con.execute(f'SELECT COUNT(*) FROM {table} WHERE {key}=?', (decision_id,)).fetchone()[0]
                  print(f'{table}[{key}]={count}')
              else:
                  print(f'{table}=NO_DECISION_KEY')
          con.close()
          PY

          echo '=== SERVICE STATE ==='
          systemctl is-active experiment1-runtime.timer
          systemctl is-active markethunter-api
          systemctl is-active markethunter-worker
          REMOTE
