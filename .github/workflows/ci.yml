name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Stage 2C backend regression tests
        run: |
          python -m pytest \
            tests/test_setup_reason_statistics.py \
            tests/test_research_api.py \
            tests/test_target_block_statistics.py \
            tests/test_portfolio_v1_domain.py \
            tests/test_portfolio_v1_assessment.py \
            tests/test_portfolio_v1_query_service.py \
            tests/test_portfolio_v1_exposure_snapshot.py \
            tests/test_risk_result_repository.py \
            tests/test_portfolio_capital_snapshot.py \
            tests/test_validation_contracts.py \
            tests/test_portfolio_monetary_admission_readiness.py \
            tests/test_risk_sizing_proposal.py \
            tests/test_execution_foundation.py \
            tests/test_risk_sizing_proposal_issuer.py \
            tests/test_strategy_registry_foundation.py \
            tests/test_explainability_foundation.py \
            tests/test_time_semantics_foundation.py \
            tests/test_audit_read_model_foundation.py \
            tests/test_manual_review_foundation.py \
            tests/test_simulation_foundation.py \
            tests/test_simulation_repository.py \
            tests/test_simulation_runtime.py \
            tests/test_experiment1_engine.py \
            tests/test_strategy_runtime_release_manifest.py \
            tests/test_strategy_execution_binding.py \
            tests/test_strategy_promotion_foundation.py \
            tests/test_trend_context_foundation.py \
            tests/test_entry_trigger_provenance.py \
            tests/test_market_data_provenance.py \
            tests/test_data_quality_policy_provenance.py \
            tests/test_portfolio_monetary_authorization.py \
            tests/test_outcome_intelligence_acquisition.py \
            tests/test_outcome_intelligence_analysis.py \
            tests/test_outcome_intelligence_slack_delivery.py \
            tests/test_outcome_intelligence_runtime.py \
            tests/test_outcome_trade_snapshot_workflow_contract.py \
            -v
