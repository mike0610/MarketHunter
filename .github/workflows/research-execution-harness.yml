name: Research Execution Harness

on:
  workflow_dispatch:
    inputs:
      object_id:
        description: Research object directory under research/jobs
        required: true
        default: HARNESS-SMOKE
  push:
    branches:
      - research-execution-queue
    paths:
      - 'research/jobs/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: research-execution-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: 149.56.45.39
      VPS_USER: ubuntu
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve exactly one frozen object
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            object_id='${{ inputs.object_id }}'
          else
            mapfile -t objects < <(
              git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}" \
                | awk -F/ '/^research\/jobs\/[^/]+\// {print $3}' \
                | sort -u
            )
            if [ "${#objects[@]}" -ne 1 ]; then
              echo "Expected exactly one changed research object, got ${#objects[@]}: ${objects[*]-}"
              exit 2
            fi
            object_id="${objects[0]}"
          fi
          printf 'OBJECT_ID=%s\n' "$object_id" >> "$GITHUB_ENV"
          echo "OBJECT_ID=$object_id"

      - name: Validate frozen job contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          object_id = os.environ['OBJECT_ID']
          if not re.fullmatch(r'[A-Z0-9][A-Z0-9._-]{1,127}', object_id):
              raise SystemExit('invalid object id')
          job_dir = Path('research/jobs') / object_id
          job_path = job_dir / 'job.json'
          run_path = job_dir / 'run.py'
          if not job_path.is_file() or not run_path.is_file():
              raise SystemExit('missing frozen job.json/run.py')
          job = json.loads(job_path.read_text())
          if job.get('object_id') != object_id:
              raise SystemExit('object id mismatch')
          if job.get('executor') != 'vps':
              raise SystemExit('v1 requires executor=vps')
          timeout = int(job.get('timeout_minutes', 0))
          if not 1 <= timeout <= 20:
              raise SystemExit('timeout_minutes must be 1..20')
          states = job.get('terminal_states')
          if not isinstance(states, list) or not states or any(not isinstance(x, str) or not x for x in states):
              raise SystemExit('terminal_states must be a non-empty string list')
          print('CONTRACT_OK', object_id, timeout, states)
          PY

      - name: Execute detached VPS job and always materialize terminal result
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence

          write_blocked() {
            reason="$1"
            python - "$reason" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/terminal_result.json').write_text(json.dumps({
              'object_id': os.environ['OBJECT_ID'],
              'terminal_state': 'BLOCKED-TOOLING',
              'executed_at_utc': datetime.now(timezone.utc).isoformat(),
              'executor': 'github-actions/vps-detached',
              'reason': sys.argv[1],
          }, sort_keys=True, separators=(',', ':')))
          PY
          }

          write_timeout() {
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('evidence/terminal_result.json').write_text(json.dumps({
              'object_id': os.environ['OBJECT_ID'],
              'terminal_state': 'EXECUTION-TIMEOUT',
              'executed_at_utc': datetime.now(timezone.utc).isoformat(),
              'executor': 'vps-detached'
          }, sort_keys=True, separators=(',', ':')))
          PY
          }

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            write_blocked 'missing-ssh-secret'
            exit 0
          fi

          install -m 700 -d ~/.ssh || { write_blocked 'ssh-dir-setup-failed'; exit 0; }
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/markethunter_vps_ed25519 || { write_blocked 'ssh-key-write-failed'; exit 0; }
          chmod 600 ~/.ssh/markethunter_vps_ed25519
          if ! ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            write_blocked 'ssh-keyscan-failed'
            exit 0
          fi
          chmod 600 ~/.ssh/known_hosts

          KEY="$HOME/.ssh/markethunter_vps_ed25519"
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 -i "$KEY")
          SCP=(scp -o BatchMode=yes -o ConnectTimeout=10 -i "$KEY")
          REMOTE="${VPS_USER}@${VPS_HOST}"
          JOB_DIR="research/jobs/${OBJECT_ID}"
          REMOTE_DIR="/tmp/mh-research-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          timeout_minutes=$(python - <<'PY'
          import json, os
          print(int(json.load(open(f"research/jobs/{os.environ['OBJECT_ID']}/job.json"))['timeout_minutes']))
          PY
          )

          if ! "${SCP[@]}" -r "$JOB_DIR" "${REMOTE}:${REMOTE_DIR}"; then
            write_blocked 'scp-job-upload-failed'
            exit 0
          fi

          if ! "${SSH[@]}" "$REMOTE" "cd '${REMOTE_DIR}' && mkdir -p result && rm -f exit_code runner.log runner.pid && rm -rf ./--job && nohup sh -c 'python3 run.py --job job.json --output result; code=\$?; if [ \"\$code\" -eq 0 ] && [ ! -s result/terminal_result.json ] && [ -s ./--job/terminal_result.json ]; then cp -a ./--job/. result/; fi; printf \"%s\\n\" \"\$code\" > exit_code' > runner.log 2>&1 < /dev/null & echo \$! > runner.pid"; then
            write_blocked 'remote-detached-start-failed'
            exit 0
          fi

          deadline=$(( $(date +%s) + timeout_minutes * 60 ))
          remote_code=""
          poll_failures=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            set +e
            status=$("${SSH[@]}" "$REMOTE" "cd '${REMOTE_DIR}' 2>/dev/null || exit 3; if [ -s result/terminal_result.json ]; then echo terminal; elif [ -s exit_code ]; then printf 'exit:'; cat exit_code; else echo running; fi" 2>/dev/null)
            rc=$?
            set -e

            if [ "$rc" -ne 0 ]; then
              poll_failures=$((poll_failures + 1))
              if [ "$poll_failures" -ge 4 ]; then
                write_blocked 'repeated-ssh-poll-failure'
                break
              fi
              sleep 10
              continue
            fi

            poll_failures=0
            case "$status" in
              terminal)
                break
                ;;
              exit:*)
                remote_code="${status#exit:}"
                break
                ;;
              running)
                sleep 10
                ;;
              *)
                write_blocked 'invalid-remote-poll-state'
                break
                ;;
            esac
          done

          if [ ! -s evidence/terminal_result.json ] && [ "$(date +%s)" -ge "$deadline" ]; then
            "${SSH[@]}" "$REMOTE" "cd '${REMOTE_DIR}' 2>/dev/null && if [ -s runner.pid ]; then kill \$(cat runner.pid) 2>/dev/null || true; fi" >/dev/null 2>&1 || true
            write_timeout
          fi

          if [ ! -s evidence/terminal_result.json ]; then
            "${SCP[@]}" -r "${REMOTE}:${REMOTE_DIR}/result/." evidence/ 2>/dev/null || true
          fi

          if [ -s evidence/terminal_result.json ]; then
            :
          elif [ -n "$remote_code" ]; then
            write_blocked "remote-exit-${remote_code}-without-terminal-result"
          else
            write_blocked 'remote-finished-without-terminal-result'
          fi

          "${SCP[@]}" "${REMOTE}:${REMOTE_DIR}/runner.log" evidence/runner.log 2>/dev/null || true
          "${SSH[@]}" "$REMOTE" "rm -rf '${REMOTE_DIR}'" >/dev/null 2>&1 || true

      - name: Validate terminal result and write provenance
        id: terminal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          object_id = os.environ['OBJECT_ID']
          job = json.loads((Path('research/jobs') / object_id / 'job.json').read_text())
          result_path = Path('evidence/terminal_result.json')
          if not result_path.is_file():
              raise SystemExit('terminal result missing after fail-closed execution step')
          result = json.loads(result_path.read_text())
          state = result.get('terminal_state')
          allowed = set(job['terminal_states']) | {'BLOCKED-TOOLING', 'EXECUTION-TIMEOUT'}
          if result.get('object_id') != object_id or state not in allowed:
              raise SystemExit(f'invalid terminal result: object={result.get("object_id")} state={state}')

          result_sha = hashlib.sha256(result_path.read_bytes()).hexdigest()
          hashes = {}
          for p in sorted(Path('evidence').rglob('*')):
              if p.is_file():
                  hashes[str(p.relative_to('evidence'))] = hashlib.sha256(p.read_bytes()).hexdigest()
          manifest = {
              'object_id': object_id,
              'terminal_state': state,
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'git_sha': os.environ['GITHUB_SHA'],
              'validated_at_utc': datetime.now(timezone.utc).isoformat(),
              'files_sha256': hashes,
          }
          mp = Path('evidence/harness_manifest.json')
          mp.write_text(json.dumps(manifest, sort_keys=True, separators=(',', ':')))
          manifest_sha = hashlib.sha256(mp.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'state={state}\n')
              f.write(f'result_sha={result_sha}\n')
              f.write(f'manifest_sha={manifest_sha}\n')
          print('TERMINAL_STATE=' + state)
          print('TERMINAL_RESULT_SHA256=' + result_sha)
          PY

      - name: Upload immutable terminal evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-terminal-${{ env.OBJECT_ID }}-${{ github.run_id }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish terminal result to durable mailbox
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_STATE: ${{ steps.terminal.outputs.state }}
          TERMINAL_RESULT_SHA256: ${{ steps.terminal.outputs.result_sha }}
          HARNESS_MANIFEST_SHA256: ${{ steps.terminal.outputs.manifest_sha }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            '<!-- MH_RESEARCH_TERMINAL run_id='"$GITHUB_RUN_ID"' attempt='"$GITHUB_RUN_ATTEMPT"' -->' \
            '**RESEARCH TERMINAL RESULT**' \
            '' \
            '- object_id: `'$OBJECT_ID'`' \
            '- terminal_state: `'$TERMINAL_STATE'`' \
            '- run_id: `'$GITHUB_RUN_ID'`' \
            '- run_attempt: `'$GITHUB_RUN_ATTEMPT'`' \
            '- git_sha: `'$GITHUB_SHA'`' \
            '- terminal_result_sha256: `'$TERMINAL_RESULT_SHA256'`' \
            '- harness_manifest_sha256: `'$HARNESS_MANIFEST_SHA256'`' \
            '- artifact_id: `'$ARTIFACT_ID'`' \
            '- artifact: '$ARTIFACT_URL > /tmp/terminal-comment.md
          gh issue comment 40 --repo "$GITHUB_REPOSITORY" --body-file /tmp/terminal-comment.md
