name: SL VAL LIQUIDITY 006 Stress Epoch
on:
  push:
    branches: [chatgpt/spot-historical-evidence-access]
    paths: ['.github/workflows/sl-val-liquidity-006.yml']
permissions:
  contents: read
jobs:
  stress-epoch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Execute frozen Binance Vision integrity gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/raw evidence/extracted
          python - <<'PY'
          import csv, hashlib, io, json, os, re, sys, urllib.request, urllib.error, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          BASE='https://data.binance.vision/data/futures/um/monthly'
          specs=[('bookTicker','BTCUSDT-bookTicker-2023-03.zip'),('bookDepth','BTCUSDT-bookDepth-2023-03.zip')]
          out=Path('evidence'); rawdir=out/'raw'; extdir=out/'extracted'
          manifest={'object':'SL-VAL-LIQUIDITY-006','retrieved_at_utc':datetime.now(timezone.utc).isoformat(),'epoch':'2023-03-01..2023-03-31 UTC','objects':[],'semantic':{}}
          blocked=False; failed=False

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'MarketHunter-Research/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      return r.status, r.read(), dict(r.headers.items())
              except urllib.error.HTTPError as e:
                  return e.code, e.read(), dict(e.headers.items())
              except Exception as e:
                  print('PROVIDER_ERROR',url,repr(e)); return None,None,{}

          def sha(b): return hashlib.sha256(b).hexdigest()

          for dataset,fn in specs:
              url=f'{BASE}/{dataset}/BTCUSDT/{fn}'
              c_url=url+'.CHECKSUM'
              status,data,headers=get(url)
              if status is None or status in (403,451,429,500,502,503,504):
                  blocked=True; manifest['objects'].append({'dataset':dataset,'path':url,'http_status':status}); continue
              if status!=200:
                  failed=True; manifest['objects'].append({'dataset':dataset,'path':url,'http_status':status}); continue
              p=rawdir/fn; p.write_bytes(data); actual=sha(data)
              c_status,c_data,_=get(c_url)
              expected=None; checksum_ok=None
              if c_status==200 and c_data:
                  (rawdir/(fn+'.CHECKSUM')).write_bytes(c_data)
                  m=re.search(rb'([0-9a-fA-F]{64})',c_data)
                  expected=m.group(1).decode().lower() if m else None
                  checksum_ok=(expected==actual) if expected else False
                  if not checksum_ok: failed=True
              rec={'dataset':dataset,'path':url,'http_status':status,'byte_count':len(data),'sha256':actual,'checksum_path':c_url,'checksum_http_status':c_status,'checksum_expected_sha256':expected,'checksum_valid':checksum_ok}
              try:
                  z=zipfile.ZipFile(io.BytesIO(data))
                  names=z.namelist(); rec['zip_members']=names
                  if not names: raise ValueError('empty zip')
                  all_rows=0; duplicate_ts=0; nonmonotonic=0; impossible=0; first_ts=None; last_ts=None
                  seen=set(); header_union=[]
                  for member in names:
                      if member.endswith('/'): continue
                      blob=z.read(member)
                      (extdir/(dataset+'__'+Path(member).name)).write_bytes(blob)
                      text=io.TextIOWrapper(io.BytesIO(blob),encoding='utf-8-sig',errors='strict',newline='')
                      rdr=csv.DictReader(text)
                      headers=rdr.fieldnames or []; header_union.extend(h for h in headers if h not in header_union)
                      lower={h.lower():h for h in headers}
                      ts_candidates=[h for h in headers if any(k in h.lower() for k in ('time','timestamp'))]
                      ts_col=ts_candidates[0] if ts_candidates else None
                      prev=None
                      for row in rdr:
                          all_rows+=1
                          if ts_col and row.get(ts_col) not in (None,''):
                              v=row[ts_col]
                              try: t=float(v)
                              except: t=None
                              if t is not None:
                                  if first_ts is None: first_ts=t
                                  last_ts=t
                                  if prev is not None and t<prev: nonmonotonic+=1
                                  prev=t
                                  key=(member,t)
                                  if key in seen: duplicate_ts+=1
                                  seen.add(key)
                          def num(*names):
                              for n in names:
                                  h=lower.get(n)
                                  if h and row.get(h) not in (None,''):
                                      try:return float(row[h])
                                      except:return None
                              return None
                          bid=num('bid_price','bidprice','best_bid_price','b'); ask=num('ask_price','askprice','best_ask_price','a')
                          bq=num('bid_qty','bidqty','best_bid_qty','bq'); aq=num('ask_qty','askqty','best_ask_qty','aq')
                          for x in (bid,ask,bq,aq):
                              if x is not None and x<0: impossible+=1
                          if bid is not None and ask is not None and bid>ask: impossible+=1
                  rec.update({'row_count':all_rows,'headers':header_union,'timestamp_first':first_ts,'timestamp_last':last_ts,'duplicate_timestamps':duplicate_ts,'nonmonotonic_timestamps':nonmonotonic,'impossible_values':impossible})
                  if all_rows==0 or nonmonotonic or duplicate_ts or impossible: failed=True
              except Exception as e:
                  rec['parse_error']=repr(e); failed=True
              manifest['objects'].append(rec)

          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True))
          print(json.dumps(manifest,sort_keys=True))
          if blocked:
              print('TERMINAL_STATE=BLOCKED-PROVIDER-ACCESS'); sys.exit(2)
          if failed:
              print('TERMINAL_STATE=STRESS-EPOCH-FAILED'); sys.exit(1)
          print('TERMINAL_STATE=STRESS-EPOCH-PASSED')
          PY
      - name: Upload immutable stress-epoch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sl-val-liquidity-006-stress-epoch
          path: evidence/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
