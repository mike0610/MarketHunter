name: Volume Breakout Empirical Validation

on:
  push:
    branches:
      - research/volume-breakout-empirical-run

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Run bounded VolumeConfirmedBreakout validation
        run: python -m research.run_volume_confirmed_breakout_validation
