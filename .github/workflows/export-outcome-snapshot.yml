name: Export Outcome Intelligence Snapshot

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Outcome Intelligence"]
    types: [completed]

permissions:
  contents: read

env:
  VPS_HOST: 149.56.45.39
  VPS_USER: ubuntu
  SNAPSHOT_ROOT: /home/ubuntu/MarketHunter/data/outcome_intelligence/runs

jobs:
  export:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Fail closed when SSH secret is unavailable
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo 'MISSING SSH SECRET'; exit 2; }

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/markethunter_actions_ed25519
          chmod 600 ~/.ssh/markethunter_actions_ed25519
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve latest production snapshot
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/markethunter_actions_ed25519"
          SNAPSHOT_ID="$(ssh -i "$KEY" "${VPS_USER}@${VPS_HOST}" \
            "find '${SNAPSHOT_ROOT}' -mindepth 1 -maxdepth 1 -type d -printf '%f\\n' 2>/dev/null | sort | tail -n1")"
          test -n "$SNAPSHOT_ID" || { echo 'SNAPSHOT-BLOCKED: no production snapshot found'; exit 3; }
          printf 'SNAPSHOT_ID=%s\n' "$SNAPSHOT_ID" >> "$GITHUB_ENV"
          printf 'SNAPSHOT_DIR=%s/%s\n' "$SNAPSHOT_ROOT" "$SNAPSHOT_ID" >> "$GITHUB_ENV"
          echo "Resolved snapshot: $SNAPSHOT_ID"

      - name: Fetch existing snapshot only
        run: |
          set -euo pipefail
          mkdir -p snapshot
          KEY="$HOME/.ssh/markethunter_actions_ed25519"
          for f in manifest.json statistics.json setup_reasons.json; do
            scp -i "$KEY" "${VPS_USER}@${VPS_HOST}:${SNAPSHOT_DIR}/$f" "snapshot/$f"
          done

      - name: Verify manifest and payload hashes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path("snapshot")
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          if manifest.get("run_id") != "${{ env.SNAPSHOT_ID }}":
              raise SystemExit(
                  f"run_id mismatch: manifest={manifest.get('run_id')} expected=${{ env.SNAPSHOT_ID }}"
              )

          expected = {
              item["artifact_filename"]: item["sha256"]
              for item in manifest.get("snapshots", [])
          }
          required = {"statistics.json", "setup_reasons.json"}
          if set(expected) != required:
              raise SystemExit(f"unexpected manifest payload set: {sorted(expected)}")

          for filename in sorted(required):
              path = root / filename
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected[filename]:
                  raise SystemExit(
                      f"sha256 mismatch for {filename}: got={digest} expected={expected[filename]}"
                  )
              json.loads(path.read_text(encoding="utf-8"))
              print(f"VERIFIED {filename} sha256={digest}")

          manifest_digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          print(f"VERIFIED manifest.json sha256={manifest_digest}")

      - name: Publish snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: outcome-intelligence-${{ env.SNAPSHOT_ID }}
          path: snapshot/*.json
          if-no-files-found: error
          retention-days: 30
