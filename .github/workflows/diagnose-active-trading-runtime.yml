name: Diagnose Active Trading Runtime

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/diagnose-active-trading-runtime.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: 149.56.45.39
      VPS_USER: ubuntu
      SSH_PRIVATE_KEY: ${{ secrets.MARKETHUNTER_VPS_SSH_PRIVATE_KEY }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Read Active Trading funnel evidence
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/key" "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -u
          cd /home/ubuntu/MarketHunter
          echo "SHA=$(git rev-parse HEAD)"
          echo '=== SCANNER TIMER/SERVICE ==='
          systemctl status gil-trading-scanner-runtime.timer --no-pager || true
          systemctl status gil-trading-scanner-runtime.service --no-pager || true
          echo '=== SCANNER JOURNAL ==='
          journalctl -u gil-trading-scanner-runtime.service -n 120 --no-pager || true
          echo '=== SAFE SCANNER CONFIG ==='
          for f in deploy/systemd/gil-trading-scanner-runtime.env /etc/markethunter/gil-trading-scanner-runtime.env; do
            if [ -f "$f" ]; then
              echo "ENV_FILE=$f"
              grep -E '^(TRADING_SCANNER_MARKET_DATA_PROVIDER|TRADING_SCANNER_UNIVERSE_SYMBOLS|TRADING_SCANNER_MAX_DATA_AGE_SECONDS|TRADING_SCANNER_HISTORY_LIMIT|TRADING_SCANNER_RESEARCH_STRATEGY_HISTORY_LIMIT|TRADING_SCANNER_DB_PATH|TRADING_SCANNER_RESEARCH_STRATEGY_DB_PATH|TRADING_SCANNER_UNIVERSE_BATCH_SIZE|TRADING_SCANNER_UNIVERSE_BATCH_STATE_PATH)=' "$f" || true
            fi
          done
          echo '=== DIAGNOSTIC UTC / ROTATION FOLLOW-UP ==='
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          echo '=== SCHEDULED SCANNER CYCLES ==='
          journalctl -u gil-trading-scanner-runtime.service --since '2026-09-20 04:27:00 UTC' --no-pager | grep -E 'universe batch selected|scanner cycle complete|scanner cycle failed|HTTP Error 429|scanner cycle skipped' || true
          echo '=== SCANNER CONFIG / CURSOR ==='
          grep -E '^(TRADING_SCANNER_MARKET_DATA_PROVIDER|TRADING_SCANNER_UNIVERSE_SYMBOLS|TRADING_SCANNER_UNIVERSE_BATCH_SIZE)=' deploy/systemd/gil-trading-scanner-runtime.env || true
          if [ -f data/trading_scanner_universe_cursor.txt ]; then cat data/trading_scanner_universe_cursor.txt; else echo 'cursor file absent'; fi
          echo '=== PAPER FUNNEL WITH PROVENANCE ==='
          .venv/bin/python - <<'PY'
          import sqlite3
          from pathlib import Path
          p=Path("data/experiment1.db")
          con=sqlite3.connect(f"file:{p}?mode=ro",uri=True)
          for table in ("experiment1_trading_decision_inbox","experiment1_intents","experiment1_fills"):
              cols=[r[1] for r in con.execute(f"pragma table_info({table})")]
              print(table+"_count",con.execute(f"select count(*) from {table}").fetchone()[0])
              print(table+"_columns",cols)
              safe=[x for x in ("created_at","received_at","observed_at","account","action","symbol","status","status_reason","source","source_reference","intent_id","reason","realized_pnl_delta") if x in cols]
              if safe:
                  rows=con.execute("select "+",".join(safe)+" from "+table+" limit 5").fetchall()
                  print(table+"_sample",rows)
          con.close()
          PY
          echo '=== SCANNER DB FUNNEL ==='
          .venv/bin/python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          paths=[
              Path(os.getenv("TRADING_SCANNER_DB_PATH","data/trading_scanner.db")),
              Path(os.getenv("TRADING_SCANNER_RESEARCH_STRATEGY_DB_PATH","data/research_strategy_signals.db")),
          ]
          for p in paths:
              print("DB",p,"exists=",p.exists(),"size=",p.stat().st_size if p.exists() else 0)
              if not p.exists(): continue
              con=sqlite3.connect(p)
              tables=[r[0] for r in con.execute("select name from sqlite_master where type='table' order by name")]
              print("TABLES",tables)
              if "trading_scanner_candidates" in tables:
                  print("QUEUE_STATES",con.execute("select queue_state,count(*) from trading_scanner_candidates group by queue_state order by queue_state").fetchall())
                  print("RECENT_CYCLES",con.execute("select scan_cycle_id,count(*),max(discovered_at) from trading_scanner_candidates group by scan_cycle_id order by max(discovered_at) desc limit 5").fetchall())
              if "research_strategy_signals" in tables:
                  print("RESEARCH_SIGNALS",con.execute("select strategy,count(*),sum(observations) from research_strategy_signals group by strategy order by strategy").fetchall())
              con.close()
          PY
          REMOTE
